name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: test-linux-py${{ matrix.py }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        py: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv venv --python ${{ matrix.py }}
      - run: uv pip install -e ".[dev,server]"
      - run: uv lock --check
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy --strict src tests
      - name: Audit dependencies
        run: uv run --no-sync pip-audit --progress-spinner off
      - name: Tests and coverage
        run: uv run --no-sync pytest --cov=arrowlane --cov-report=term-missing --cov-fail-under=90

  test-other:
    name: test-other
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv venv --python 3.15
      - run: uv pip install -e ".[dev,server]"
      - run: uv lock --check
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy --strict src tests
      - name: Tests
        run: uv run --no-sync pytest

  arm64-linux:
    name: arm64-linux-py3.15
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv venv --python 3.15
      - run: uv lock --check
      - run: uv sync --frozen --extra dev --extra server
      - run: uv run --no-sync pytest
      # The C++ port publishes a bench artifact from this same runner. This is the
      # reference side of that comparison.
      - name: Bench
        run: >
          uv run --no-sync python bench/containers/python_bench.py
          --rows 200000 --repeats 5 | tee bench-arm64.txt
      - name: Upload the numbers
        uses: actions/upload-artifact@v7
        with:
          name: bench-arm64
          path: bench-arm64.txt

  integrations:
    name: integrations-py3.15
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv venv --python 3.15
      - run: uv pip install -e ".[dev,server,pandas,polars]"
      - run: uv run --no-sync pytest tests/test_table.py -q
