[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "arrowlane"
version = "0.3.1"
description = "Columnar data lanes for ingress and egress in containerized Python apps."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Kennedy Naidoo" }]
keywords = ["arrow", "data-transit", "ipc", "zstd", "shared-memory", "sidecar", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "pyarrow>=26.0.0,<27",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
server = ["starlette>=1.3.1,<2", "uvicorn>=0.54,<1"]
duckdb = ["duckdb>=2.0.0,<3"]
polars = ["polars>=1.0"]
pandas = ["pandas>=3.0"]
bench = ["numpy>=2", "orjson>=3.10"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "httpx2>=2.16",
    "hypothesis>=6.170",
    "numpy>=2",
    "mypy>=1.13",
    "ruff>=0.9",
    "pyyaml>=6.0",
    "pip-audit>=2.8",
]

[project.scripts]
arrowlane = "arrowlane.cli:main"

[project.urls]
Homepage = "https://github.com/kennaidoo/arrowlane"
Documentation = "https://github.com/kennaidoo/arrowlane/tree/main/docs"
Changelog = "https://github.com/kennaidoo/arrowlane/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/arrowlane"]

[tool.hatch.build.targets.wheel.force-include]
"docs/ai/operating-guide.md" = "arrowlane/ai/operating-guide.md"
"llms.txt" = "arrowlane/ai/llms.txt"
"docs/ai/quickstart.md" = "arrowlane/ai/quickstart.md"
"docs/ai/api.md" = "arrowlane/ai/api.md"
"docs/ai/recipes.md" = "arrowlane/ai/recipes.md"
"docs/ai/manifest.json" = "arrowlane/ai/manifest.json"
"docs/platforms.md" = "arrowlane/ai/platforms.md"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "bench", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"bench/*" = ["S311", "S603"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*", "bench.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "polars", "polars.*", "yaml", "duckdb", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --timeout=120"
pythonpath = ["."]
markers = [
    "linux: requires POSIX shared memory",
    "slow: takes more than 2 seconds",
]

[tool.coverage.run]
branch = true
source = ["arrowlane"]

# The coverage floor is enforced on Linux, where the POSIX shared memory
# lanes run. Windows and macOS measure the portable lanes only.
[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
